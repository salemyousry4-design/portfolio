<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salem Yousry OG image</title>
<!--
  Source of public/og-image.png (1200x630, shown when the site link is shared).
  Rebuild: msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png docs/og-image.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 78% 50%, #2a2233 0%, #0f0d12 62%);
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e8e8e8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 90px;
  }
  .text { max-width: 640px; }
  .kicker { color: #c8a25a; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; font-weight: 600; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 84px; line-height: 1.05; margin: 14px 0 22px;
       background: linear-gradient(135deg, #e0c17a, #c8a25a 55%, #8a6a1f); -webkit-background-clip: text; color: transparent; }
  .role { font-size: 32px; font-weight: 600; color: #f1ead9; }
  .sub { font-size: 24px; color: #a59fae; margin-top: 14px; }
  .rule { width: 90px; height: 4px; background: #c8a25a; border-radius: 2px; margin: 30px 0 0; }
  img { width: 360px; height: auto; filter: drop-shadow(0 0 40px rgba(200,162,90,.25)); }
</style>
</head>
<body>
  <div class="text">
    <div class="kicker">Tech × Business</div>
    <h1>Salem Yousry</h1>
    <div class="role">Machine Learning Engineer</div>
    <div class="sub">Business Development &amp; Strategy · MBA</div>
    <div class="rule"></div>
  </div>
  <img src="../public/salem-logo.png" alt="">
</body>
</html>
